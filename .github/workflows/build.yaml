name: Build and Run

on:
  push:
  pull_request:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get repo name
      id: repo-name
      run: echo "name=$(echo "${{github.repository}}" | awk -F '/' '{print $2}')" >> $GITHUB_OUTPUT

    - name: Build
      run: ./scripts/build.sh native

    - name: Run
      run: cd ./build-native && ./${{steps.repo-name.outputs.name}} -i ../config/pipeline.yaml -v
