pipeline:
  branches:
    - name: main
      elements:
        - name: v4l2src
          properties:
            device: /dev/video0
        - name: capsfilter
          properties:
            caps: video/x-raw,format=YUY2,width=640,height=480,framerate=30/1
        - name: nvvideoconvert
        - name: capsfilter
          properties:
            caps: video/x-raw(memory:NVMM),format=NV12,width=640,height=480,framerate=30/1
        - name: tee
          type: atr_tee
        - name: nvv4l2h264enc
        - name: h264parse
        - name: rtspclientsink
          properties:
            location: rtsp://localhost:8554/stream1
    - name: atr_tee
      optional: true
      elements:
        - name: queue
        # - name: nvstreammux
        #   properties:
        #     batch-size: 1
        #     width: 640
        #     height: 480
        # - name: nvinfer
        #   properties:
        #     config-file-path: /home/fronti/project/video/gst-pipeline-launch/resources/detector/infer_config.yml
        # - name: nvvideoconvert 
        #   properties:
        #     disable-passthrough: true
        # - name: nvdsosd
        - name: nvv4l2h264enc
        - name: h264parse
        - name: rtspclientsink
          properties:
            location: rtsp://localhost:8554/stream2

# gst-launch-1.0 v4l2src device=/dev/video0 ! video/x-raw,format=YUY2,width=640,height=480 ! nvvideoconvert ! "video/x-raw(memory:NVMM),format=NV12,width=1920,height=1080,framerate=30/1" ! nvv4l2h264enc ! h264parse ! rtspclientsink location=rtsp://localhost:8554/stream1